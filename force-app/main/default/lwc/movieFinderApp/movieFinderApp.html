<template>
    <lightning-tabset>
        <lightning-tab label="Browse" value="browse">
            <c-movie-browser
                service-filter        = {serviceFilter}
                oninteractionrecorded = {handleInteractionRecorded}
            ></c-movie-browser>
        </lightning-tab>

        <lightning-tab label="Search" value="search">
            <c-movie-search></c-movie-search>
        </lightning-tab>

        <lightning-tab label="For You" value="foryou">
            <c-movie-recommendations></c-movie-recommendations>
        </lightning-tab>

        <lightning-tab label="Swipe" value="swipe">
            <c-swipe-session
                onsessionended = {handleSessionEnded}
            ></c-swipe-session>
        </lightning-tab>

        <lightning-tab label="My Services" value="services">
            <c-subscription-manager
                onserviceselected = {handleServiceSelected}
            ></c-subscription-manager>
        </lightning-tab>
    </lightning-tabset>
</template>
